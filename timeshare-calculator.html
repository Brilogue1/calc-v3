// ─── Send PDF to Apps Script web app ────────────────────────────────────────────
async function sendToAppsScript(scriptUrl, pdfBlob, fileName, ownerName, resortName) {
  // Convert blob to base64
  const arrayBuffer = await pdfBlob.arrayBuffer();
  const uint8 = new Uint8Array(arrayBuffer);
  let binary = "";
  for (let i = 0; i < uint8.length; i++) binary += String.fromCharCode(uint8[i]);
  const pdfBase64 = btoa(binary);

  const payload = {
    action: "savePdf",
    pdfBase64,
    fileName,
    ownerName,
    resortName,
  };

  const res = await fetch(scriptUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload),
    redirect: "follow",
  });

  if (!res.ok) throw new Error("Apps Script returned status " + res.status);
  const result = await res.json();
  if (!result.success) throw new Error(result.error || "Apps Script error");
  return result;
}

// ─── Generate PDF blob from DOM element ───────────────────────────────────────
async function generatePdfBlob(element) {
  const { jsPDF } = window.jspdf;
  const pages = element.querySelectorAll('.print-page');
  const pdf = new jsPDF('p', 'pt', 'letter');

  for (let i = 0; i < pages.length; i++) {
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'background:white;padding:40px;width:612px;box-sizing:border-box;position:fixed;left:-9999px;top:0;';
    const clone = pages[i].cloneNode(true);
    // Remove no-print elements from clone
    clone.querySelectorAll('.no-print').forEach(el => el.remove());
    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);

    const canvas = await window.html2canvas(wrapper, {
      scale: 2,
      useCORS: true,
      logging: false,
      backgroundColor: '#ffffff',
      width: 692,
      windowWidth: 692,
    });

    document.body.removeChild(wrapper);

    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const imgWidth = 612;
    const actualHeight = (canvas.height * imgWidth) / canvas.width;
    const pageHeight = 792;

    if (i > 0) pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, 0, imgWidth, Math.min(actualHeight, pageHeight));
  }

  return pdf.output('blob');
}

    (parseFloat(num) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  const calculateProjections = (maintenanceFee, inflationRate) => {
    const rate = inflationRate / 100;
    const years = [];
    let cumulative = 0;
    for (let year = 1; year <= 30; year++) {
      const annualCost = maintenanceFee * Math.pow(1 + rate, year);
      cumulative += annualCost;
      years.push({ year, annualCost, cumulative });
    }
    return { years, totalInflation: cumulative, year30Cost: years[29].annualCost };
  };

  const generateDropSheets = () => {
    const sheets = formData.resorts
      .filter(resort => resort.active && resort.maintenanceFee > 0)
      .map((resort) => {
        const projections = calculateProjections(resort.maintenanceFee, resort.inflationRate);
        const year20Cumulative = projections.years[19].cumulative;
        const grossLiquidation = year20Cumulative + formData.transferFees + formData.processingFee;
        const eboc = grossLiquidation - formData.mra;
        return {
          resortName: resort.name,
          owner: formData.owner1Name,
          address: formData.homeAddress,
          phone: formData.mobilePhone1 || formData.homePhone,

          grossLiquidation,
          eboc,
          projections: projections.years,

    setSaveStatus({});
    setSavedLinks({});
  };

    setFormData(prev => ({ ...prev, [field]: value }));

      resorts: prev.resorts.map((r, i) => i === index ? { ...r, [field]: value } : r),

      // 2. Send to Apps Script (handles Drive upload + Sheet logging)
      setSaveStatus(prev => ({ ...prev, [sheetIndex]: 'uploading' }));
      const result = await sendToAppsScript(
        cfg.APPS_SCRIPT_URL,
        pdfBlob,
        fileName,
        sheet.owner || 'Client',
        sheet.resortName || 'Resort'
      );

      // 3. Done!
      setSavedLinks(prev => ({ ...prev, [sheetIndex]: result.fileUrl }));
      setSaveStatus(prev => ({ ...prev, [sheetIndex]: 'done' }));

Make sure your APPS_SCRIPT_URL is correct and deployed as Anyone can access.');

          .signature-line { border-bottom: 1px solid #000 !important; margin-bottom: 3px !important; }
          input[type="number"] { border: none !important; background: transparent !important; font-weight: bold !important; }
        }
      `}</style>

      {/* Header */}
      <div className="no-print" style={{ padding: '24px 0', borderBottom: '2px solid #7c3aed', background: '#000000' }}>
        <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '0 24px' }}>
          <h1 style={{ fontSize: '32px', fontWeight: '800', background: 'linear-gradient(135deg, #7c3aed 0%, #60a5fa 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text', marginBottom: '20px', letterSpacing: '-0.5px' }}>
            Timeshare Calculator
          </h1>
          <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
            <div className={`step-indicator ${step === 1 ? 'active' : ''}`}>1. Input</div>
            <div className={`step-indicator ${step === 2 ? 'active' : ''}`}>2. Drop Sheets</div>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '32px 24px' }}>

        {/* ── STEP 1: Input ── */}
        {step === 1 && (
          <div className="fade-in">

            {/* Summary Stats */}
            <div className="grid-3" style={{ marginBottom: '24px' }}>
              <div className="stat-card">
                <div className="stat-label">ACTIVE RESORTS</div>
                <div className="stat-value">{activeResorts.length}</div>
              </div>
              <div className="stat-card">
                <div className="stat-label">TOTAL ANNUAL MAINT.</div>
                <div className="stat-value">${formatCurrency(totalAnnualMaint)}</div>
              </div>
              <div className="stat-card">
                <div className="stat-label">MORTGAGE BALANCE</div>
                <div className="stat-value">${formatCurrency(formData.mortgage)}</div>
              </div>
            </div>

            {/* Owner Information */}
            <div className="section-card">
              <div className="section-header">
                <div className="icon-wrapper"><User size={20} /></div>
                <h2 className="section-title">Owner Information</h2>
              </div>
              <div className="grid-2" style={{ marginBottom: '16px' }}>
                <div>
                  <label className="label">Owner 1 Name *</label>
                  <input type="text" className="input-field" value={formData.owner1Name} onChange={e => handleInputChange('owner1Name', e.target.value)} placeholder="John Smith" />
                </div>
                <div>
                  <label className="label">Owner 2 Name</label>
                  <input type="text" className="input-field" value={formData.owner2Name} onChange={e => handleInputChange('owner2Name', e.target.value)} placeholder="Jane Smith" />
                </div>
                <div>
                  <label className="label">Owner 3 Name</label>
                  <input type="text" className="input-field" value={formData.owner3Name} onChange={e => handleInputChange('owner3Name', e.target.value)} placeholder="Optional" />
                </div>
                <div>
                  <label className="label">Owner 4 Name</label>
                  <input type="text" className="input-field" value={formData.owner4Name} onChange={e => handleInputChange('owner4Name', e.target.value)} placeholder="Optional" />
                </div>
              </div>
              <div className="grid-3" style={{ marginBottom: '16px' }}>
                <div style={{ gridColumn: 'span 2' }}>
                  <label className="label">Home Address</label>
                  <input type="text" className="input-field" value={formData.homeAddress} onChange={e => handleInputChange('homeAddress', e.target.value)} placeholder="123 Main Street" />
                </div>
                <div>
                  <label className="label">City</label>
                  <input type="text" className="input-field" value={formData.city} onChange={e => handleInputChange('city', e.target.value)} placeholder="Orlando" />
                </div>
              </div>
              <div className="grid-3" style={{ marginBottom: '16px' }}>
                <div>
                  <label className="label">State</label>
                  <input type="text" className="input-field" value={formData.state} onChange={e => handleInputChange('state', e.target.value)} placeholder="FL" />
                </div>
                <div>
                  <label className="label">ZIP Code</label>
                  <input type="text" className="input-field" value={formData.zip} onChange={e => handleInputChange('zip', e.target.value)} placeholder="32801" />
                </div>
                <div>
                  <label className="label">Home Phone</label>
                  <input type="tel" className="input-field" value={formData.homePhone} onChange={e => handleInputChange('homePhone', e.target.value)} placeholder="(555) 000-0000" />
                </div>
              </div>
              <div className="grid-3">
                <div>
                  <label className="label">Mobile Phone 1</label>
                  <input type="tel" className="input-field" value={formData.mobilePhone1} onChange={e => handleInputChange('mobilePhone1', e.target.value)} placeholder="(555) 000-0000" />
                </div>
                <div>
                  <label className="label">Mobile Phone 2</label>
                  <input type="tel" className="input-field" value={formData.mobilePhone2} onChange={e => handleInputChange('mobilePhone2', e.target.value)} placeholder="(555) 000-0000" />
                </div>
                <div>
                  <label className="label">Email 1</label>
                  <input type="email" className="input-field" value={formData.email1} onChange={e => handleInputChange('email1', e.target.value)} placeholder="john@email.com" />
                </div>
              </div>
            </div>

            {/* Mortgage */}
            <div className="section-card">
              <div className="section-header">
                <div className="icon-wrapper"><DollarSign size={20} /></div>
                <h2 className="section-title">Mortgage Information</h2>
              </div>
              <div style={{ maxWidth: '300px' }}>
                <label className="label">Mortgage Balance</label>
                <input type="number" className="input-field" value={formData.mortgage} onChange={e => handleInputChange('mortgage', parseFloat(e.target.value) || 0)} placeholder="0" />
              </div>
            </div>

            {/* Resorts */}
            <div className="section-card">
              <div className="section-header">
                <div className="icon-wrapper"><Building2 size={20} /></div>
                <h2 className="section-title">Resort Information</h2>
              </div>
              {formData.resorts.map((resort, index) => (
                <div key={index} className={`resort-card ${resort.active ? 'active' : 'inactive'}`}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: resort.active ? '20px' : '0' }}>
                    <h3 style={{ fontSize: '16px', fontWeight: '700', color: '#e2e8f0' }}>Resort {index + 1}</h3>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                      <span style={{ fontSize: '13px', color: '#94a3b8', fontWeight: '600' }}>{resort.active ? 'Active' : 'Inactive'}</span>
                      <div className={`toggle-switch ${resort.active ? 'active' : ''}`} onClick={() => handleResortChange(index, 'active', !resort.active)}>
                        <div className="toggle-slider" />
                      </div>
                    </div>
                  </div>
                  {resort.active && (
                    <div>
                      <div className="grid-2" style={{ marginBottom: '16px' }}>
                        <div>
                          <label className="label">Resort Name</label>
                          <input type="text" className="input-field" value={resort.name} onChange={e => handleResortChange(index, 'name', e.target.value)} placeholder="Marriott Vacation Club" />
                        </div>
                        <div>
                          <label className="label">Resort Address</label>
                          <input type="text" className="input-field" value={resort.address} onChange={e => handleResortChange(index, 'address', e.target.value)} placeholder="123 Resort Blvd" />
                        </div>
                      </div>
                      <div className="grid-3" style={{ marginBottom: '16px' }}>
                        <div>
                          <label className="label">City</label>
                          <input type="text" className="input-field" value={resort.city} onChange={e => handleResortChange(index, 'city', e.target.value)} placeholder="Orlando" />
                        </div>
                        <div>
                          <label className="label">State</label>
                          <input type="text" className="input-field" value={resort.state} onChange={e => handleResortChange(index, 'state', e.target.value)} placeholder="FL" />
                        </div>
                        <div>
                          <label className="label">ZIP</label>
                          <input type="text" className="input-field" value={resort.zip} onChange={e => handleResortChange(index, 'zip', e.target.value)} placeholder="32801" />
                        </div>
                      </div>
                      <div className="grid-3">
                        <div>
                          <label className="label">Ownership Type</label>
                          <input type="text" className="input-field" value={resort.ownershipType} onChange={e => handleResortChange(index, 'ownershipType', e.target.value)} placeholder="Deeded / Points" />
                        </div>
                        <div>
                          <label className="label">Annual Maintenance Fee *</label>
                          <input type="number" className="input-field" value={resort.maintenanceFee} onChange={e => handleResortChange(index, 'maintenanceFee', parseFloat(e.target.value) || 0)} placeholder="1200" />
                        </div>
                        <div>
                          <label className="label">Inflation Rate (%)</label>
                          <input type="number" step="0.1" className="input-field" value={resort.inflationRate} onChange={e => handleResortChange(index, 'inflationRate', parseFloat(e.target.value) || 0)} placeholder="8.3" />
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* Drop Sheet Defaults */}
            <div className="section-card">
              <div className="section-header">
                <div className="icon-wrapper"><TrendingUp size={20} /></div>
                <h2 className="section-title">Drop Sheet Defaults</h2>
              </div>
              <div className="grid-3">
                <div>
                  <label className="label">Transfer Fees</label>
                  <input type="number" className="input-field" value={formData.transferFees} onChange={e => handleInputChange('transferFees', parseFloat(e.target.value) || 0)} placeholder="1800" />
                </div>
                <div>
                  <label className="label">Processing Fee</label>
                  <input type="number" className="input-field" value={formData.processingFee} onChange={e => handleInputChange('processingFee', parseFloat(e.target.value) || 0)} placeholder="449" />
                </div>
                <div>
                  <label className="label">MRA Value</label>
                  <input type="number" className="input-field" value={formData.mra} onChange={e => handleInputChange('mra', parseFloat(e.target.value) || 0)} placeholder="12500" />
                </div>
              </div>
            </div>

            {/* Continue Button */}
            <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '24px' }}>
              <button
                onClick={goToDropSheets}
                className="btn-primary"
                style={{ display: 'flex', alignItems: 'center', gap: '8px' }}
                disabled={!formData.owner1Name || !activeResorts.some(r => r.maintenanceFee > 0)}
              >
                Generate Drop Sheets
                <ChevronRight size={20} />
              </button>
            </div>
          </div>
        )}

        {/* ── STEP 2: Drop Sheets ── */}
        {step === 2 && (
          <div className="fade-in">
            <div className="no-print glass-card" style={{ padding: '28px', marginBottom: '24px' }}>
              <h2 style={{ fontSize: '28px', fontWeight: '800', color: '#e2e8f0', marginBottom: '12px' }}>Drop Sheets</h2>
              <p style={{ color: '#94a3b8', marginBottom: '20px', fontWeight: '500' }}>
                Review and edit values as needed, then print or save each drop sheet to Google Drive.
              </p>
              <button onClick={() => setStep(1)} className="btn-secondary" style={{ display: 'inline-flex', alignItems: 'center', gap: '8px' }}>
                <ChevronLeft size={20} />
                Back to Input
              </button>
            </div>

            {dropSheetData.map((sheet, idx) => (
              <div key={idx}>
                <div id={`drop-sheet-${idx}`}>

                  {/* PAGE 1: Summary & Comparison */}
                  <div className="print-page" style={{ background: 'white', padding: '20px', marginBottom: '20px', borderRadius: '12px' }}>
                    <div className="print-header avoid-break" style={{ marginBottom: '20px' }}>
                      <h1 style={{ fontSize: '20px', fontWeight: 'bold', marginBottom: '12px', color: '#000' }}>TIMESHARE LIQUIDATION ANALYSIS</h1>
                      <div className="print-info-grid">
                        <div><strong>Owner:</strong> {sheet.owner}</div>
                        <div><strong>Resort:</strong> {sheet.resortName}</div>
                        <div style={{ gridColumn: 'span 2', marginBottom: '15px' }}>
                          <strong>Inflation Rate:</strong> {sheet.inflationRate}%
                        </div>
                      </div>
                    </div>

                    <div className="comparison-grid avoid-break" style={{ gap: '20px' }}>
                      {/* Option 1 */}
                      <div className="option-box" style={{ border: '3px solid #ef4444', borderRadius: '8px', padding: '16px', background: '#fff' }}>
                        <div className="option-header" style={{ background: '#fee2e2', padding: '12px', marginBottom: '12px', borderLeft: '4px solid #ef4444', borderRadius: '4px' }}>
                          <h2 style={{ fontSize: '14px', fontWeight: 'bold', margin: 0, color: '#991b1b' }}>Option 1: CURRENT CONTRACT</h2>
                        </div>
                        <div style={{ fontSize: '11px', lineHeight: '1.6' }}>
                          <div style={{ marginBottom: '6px' }}><strong>Resort:</strong> {sheet.resortName}</div>
                          <div style={{ marginBottom: '4px' }}>✗ Maintenance / Taxes Fees Inflation</div>
                          <div style={{ marginBottom: '4px' }}>✗ Tied to Owner's Estate</div>
                          <div style={{ marginBottom: '4px' }}>✗ Probate Liability</div>
                          <div style={{ marginBottom: '4px' }}>✗ Deeded Property</div>
                          <div style={{ marginBottom: '4px' }}>✗ External Exchange Fees</div>
                          <div style={{ marginBottom: '4px' }}>✗ Travel Demand Index Risk</div>
                          <div style={{ marginBottom: '4px' }}>✗ No Exit Strategy</div>
                          <div style={{ marginBottom: '6px', fontSize: '10px', color: '#666' }}>Subject to House Bill 453 &amp; 7025</div>
                        </div>
                        <div className="cost-box" style={{ marginTop: '12px', padding: '12px', background: '#fee2e2', border: '2px solid #ef4444' }}>
                          <div className="cost-row" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <strong>Annual Maintenance / Taxes Fee:</strong>
                            <span>${formatCurrency(sheet.currentMaintFee)}</span>
                          </div>
                          <div className="cost-row" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <strong>30-Year Inflation Total:</strong>
                            <span>${formatCurrency(sheet.maintFeeInflation)}</span>
                          </div>
                          <div className="cost-row" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <strong>Mortgage Payoff:</strong>
                            <span>${formatCurrency(sheet.mortgage)}</span>
                          </div>
                          <div className="cost-total" style={{ paddingTop: '8px', borderTop: '2px solid #ef4444', fontSize: '12px', fontWeight: 'bold', display: 'flex', justifyContent: 'space-between' }}>
                            <span>Total Cost of Ownership:</span>
                            <span>${formatCurrency(sheet.totalCost)}</span>
                          </div>
                        </div>
                      </div>

                      {/* Option 2 */}
                      <div className="option-box" style={{ border: '3px solid #10b981', borderRadius: '8px', padding: '16px', background: '#fff' }}>
                        <div className="option-header" style={{ background: '#d1fae5', padding: '12px', marginBottom: '12px', borderLeft: '4px solid #10b981', borderRadius: '4px' }}>
                          <h2 style={{ fontSize: '14px', fontWeight: 'bold', margin: 0, color: '#065f46' }}>Option 2: LIQUIDATION/TERMINATION</h2>
                        </div>
                        <div style={{ fontSize: '11px', lineHeight: '1.6' }}>
                          <div style={{ marginBottom: '4px' }}>✓ Deed Liquidation/Termination</div>
                          <div style={{ marginBottom: '4px' }}>✓ NO Maintenance / Taxes Fees</div>
                          <div style={{ marginBottom: '4px' }}>✓ NOT Tied to Owner's Estate</div>
                          <div style={{ marginBottom: '4px' }}>✓ Liability Protection</div>
                          <div style={{ marginBottom: '4px' }}>✓ HB 453 Release</div>
                          <div style={{ marginBottom: '4px' }}>✓ HB 7025 Release</div>
                        </div>
                        <div className="cost-box" style={{ marginTop: '12px', padding: '12px', background: editingDropSheet === idx ? '#fef3c7' : '#d1fae5', border: `2px solid ${editingDropSheet === idx ? '#f59e0b' : '#10b981'}` }}>
                          <div className="no-print" style={{ marginBottom: '12px', textAlign: 'right' }}>
                            <button
                              onClick={() => setEditingDropSheet(editingDropSheet === idx ? null : idx)}
                              style={{ background: editingDropSheet === idx ? '#f59e0b' : '#10b981', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '11px', fontWeight: '600', display: 'inline-flex', alignItems: 'center', gap: '4px' }}
                            >
                              {editingDropSheet === idx ? <><Check size={14} /> Done</> : <><Edit2 size={14} /> Edit</>}
                            </button>
                          </div>
                          <div className="cost-row" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <strong>Cost of Liquidation:</strong>
                            <span>${formatCurrency(sheet.year20Cumulative)}</span>
                          </div>
                          <div className="cost-row" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <strong>Transfer Fees:</strong>
                            {editingDropSheet === idx ? (
                              <input type="number" value={sheet.transferFees} onChange={e => handleDropSheetEdit(idx, 'transferFees', e.target.value)} style={{ width: '100px', padding: '4px', border: '1px solid #ccc', borderRadius: '4px', textAlign: 'right' }} />
                            ) : <span>${formatCurrency(sheet.transferFees)}</span>}
                          </div>
                          <div className="cost-row" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <strong>Processing Fee:</strong>
                            {editingDropSheet === idx ? (
                              <input type="number" value={sheet.processingFee} onChange={e => handleDropSheetEdit(idx, 'processingFee', e.target.value)} style={{ width: '100px', padding: '4px', border: '1px solid #ccc', borderRadius: '4px', textAlign: 'right' }} />
                            ) : <span>${formatCurrency(sheet.processingFee)}</span>}
                          </div>
                          <div className="cost-row" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', paddingBottom: '8px', borderBottom: '1px solid #999' }}>
                            <strong>Gross Liquidation Price:</strong>
                            <span>${formatCurrency(sheet.grossLiquidation)}</span>
                          </div>
                          <div className="cost-row" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <strong>EBOC:</strong>
                            <span>${formatCurrency(sheet.eboc)}</span>
                          </div>
                          <div className="cost-row" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <strong>MRA:</strong>
                            {editingDropSheet === idx ? (
                              <input type="number" value={sheet.mra} onChange={e => handleDropSheetEdit(idx, 'mra', e.target.value)} style={{ width: '100px', padding: '4px', border: '1px solid #ccc', borderRadius: '4px', textAlign: 'right' }} />
                            ) : <span>${formatCurrency(sheet.mra)}</span>}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* PAGE 2: 30-Year Projection Table */}
                  <div className="print-page" style={{ background: 'white', padding: '20px', marginBottom: '20px', borderRadius: '12px' }}>
                    <h3 style={{ fontSize: '16px', fontWeight: 'bold', marginBottom: '12px', color: '#000' }}>
                      30-Year Maintenance / Taxes Fee Projection — {sheet.resortName}
                    </h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px' }}>
                      <thead>
                        <tr style={{ background: '#f3f4f6', borderBottom: '2px solid #000' }}>
                          <th style={{ padding: '8px', textAlign: 'left' }}>Year</th>
                          <th style={{ padding: '8px', textAlign: 'right' }}>Annual Cost</th>
                          <th style={{ padding: '8px', textAlign: 'right' }}>Cumulative Cost</th>
                        </tr>
                      </thead>
                      <tbody>
                        {sheet.projections.map(y => (
                          <tr key={y.year} style={{ borderBottom: '1px solid #ddd', background: y.year === 20 ? '#fef9c3' : 'transparent' }}>
                            <td style={{ padding: '6px' }}>Year {y.year}{y.year === 20 ? ' ★' : ''}</td>
                            <td style={{ padding: '6px', textAlign: 'right' }}>${formatCurrency(y.annualCost)}</td>
                            <td style={{ padding: '6px', textAlign: 'right', fontWeight: 'bold' }}>${formatCurrency(y.cumulative)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* PAGE 3: Signature */}
                  <div className="print-page" style={{ background: 'white', padding: '20px', marginBottom: '20px', borderRadius: '12px' }}>
                    <div className="signature-section avoid-break">
                      <h3 style={{ fontSize: '14px', fontWeight: 'bold', marginBottom: '15px' }}>OWNER ACKNOWLEDGMENT</h3>
                      <div style={{ marginBottom: '25px' }}>
                        <p style={{ marginBottom: '12px', fontSize: '11px' }}>
                          The foregoing document was acknowledged before me this _____ day of _____________, 20____.
                        </p>
                        <div style={{ marginTop: '30px' }}>
                          <div style={{ display: 'inline-block', width: '45%', marginRight: '5%' }}>
                            <div className="signature-line" style={{ height: '30px' }}>&nbsp;</div>
                            <div style={{ fontSize: '10px' }}>Signature</div>
                          </div>
                          <div style={{ display: 'inline-block', width: '45%' }}>
                            <div className="signature-line" style={{ height: '30px' }}>&nbsp;</div>
                            <div style={{ fontSize: '10px' }}>Date</div>
                          </div>
                        </div>
                      </div>
                      <div style={{ marginTop: '25px', fontSize: '11px' }}>
                        <div style={{ fontWeight: 'bold', marginBottom: '10px' }}>Please initial your selection:</div>
                        <div style={{ marginBottom: '8px', lineHeight: '1.6' }}>OPTION 1 (Current Contract): _______ ACCEPT &nbsp;&nbsp; _______ DECLINE</div>
                        <div style={{ lineHeight: '1.6' }}>OPTION 2 (Liquidation): _______ ACCEPT &nbsp;&nbsp; _______ DECLINE</div>
                      </div>
                    </div>
                  </div>

                </div>{/* end drop-sheet container */}

                {/* Action Buttons */}
                <div className="no-print" style={{ marginBottom: '40px', textAlign: 'center' }}>
                  <div style={{ display: 'flex', gap: '16px', justifyContent: 'center', flexWrap: 'wrap', marginBottom: '12px' }}>
                    <button
                      onClick={() => printDropSheet(idx)}
                      className="btn-primary"
                      style={{ display: 'inline-flex', alignItems: 'center', gap: '10px' }}
                    >
                      <Printer size={20} />
                      Print {sheet.resortName}
                    </button>
                    <SaveButton idx={idx} />
                  </div>
                  {savedLinks[idx] && (
                    <div style={{ marginTop: '8px', padding: '12px 20px', background: '#0a2a1a', border: '1px solid #10b981', borderRadius: '12px', display: 'inline-block' }}>
                      <span style={{ color: '#34d399', fontSize: '13px', fontWeight: '600' }}>
                        ✅ Saved &amp; logged to your Google Sheet — &nbsp;
                      </span>
                      <a href={savedLinks[idx]} target="_blank" rel="noopener noreferrer" style={{ color: '#60a5fa', fontSize: '13px', fontWeight: '700' }}>
                        Open PDF in Drive →
                      </a>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<TimeshareCalculator />, document.getElementById('root'));
</script>
</body>
</html>
